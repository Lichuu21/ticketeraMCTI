version: '3.8'

services:
  ticket-web:
    container_name: ticket-web
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    environment:
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
    ports:
      - "8070:5173"
    depends_on:
      - ticket-api
    networks:
      - ticket-net
    restart: unless-stopped

  ticket-api:
    container_name: ticket-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: America/Argentina/Buenos_Aires
    env_file:
      - .env.develop
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/static
    ports:
      - "8071:8000"
    depends_on:
      ticket-db:
        condition: service_healthy
    networks:
      - ticket-net
    restart: unless-stopped
    entrypoint: [ "bash", "entrypoint.sh" ]

  ticket-db:
    container_name: ticket-db
    image: mariadb:11.6
    environment:
      TZ: America/Argentina/Buenos_Aires
    env_file:
      - .env.develop
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ticket-net

  ticket-pma:
    container_name: ticket-pma
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      PMA_HOST: ticket-db
      PMA_PORT: 3306
      PMA_ARBITRARY: "1"
      UPLOAD_LIMIT: 64M
    ports:
      - "8170:80"
    depends_on:
      ticket-db:
        condition: service_healthy
    networks:
      - ticket-net

volumes:
  mariadb_data:
  media_data:
  static_data:

networks:
  ticket-net:
