server {
    listen 80;
    server_name _ ticketeradele3.cti.gob.ar localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Django admin + API
    location /admin/ {
        proxy_pass http://ticket-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://ticket-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://ticket-api:8000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        proxy_pass http://ticket-api:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /wallpapers/ {
        expires 30d;
    }

    location /favicon* {
        expires 30d;
    }

    location /logo* {
        expires 30d;
    }

    location /site.webmanifest {
        expires 30d;
    }
}
