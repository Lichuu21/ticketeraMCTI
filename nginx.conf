server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /wallpapers/ {
        expires 30d;
    }

    location /favicon* {
        expires 30d;
    }

    location /logo* {
        expires 30d;
    }

    location /site.webmanifest {
        expires 30d;
    }
}
